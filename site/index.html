<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183d32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RH Games">
<title>RH Games</title>
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/site.css?v=__ASSET_VERSION__">
</head>
<body>
<header class="header"><h1>RH GAMES</h1><a href="https://t.me/rh_games_releases" target="_blank" rel="noopener noreferrer">Telegram ↗</a></header>
<main class="games" aria-label="Игры">
<article class="card"><a class="art-link" href="lovec-suiko/" aria-label="Играть в Ловца чудес"><img src="lovec-suiko/poster.png" alt="Ловец чудес" fetchpriority="high"></a><div class="card-body"><div class="title"><h2>Ловец чудес</h2><span data-version="lovec-suiko">v__LOVEC_SUIKO_VERSION__</span></div><a class="play" href="lovec-suiko/">Играть <span aria-hidden="true">↗</span></a></div></article>
<article class="card"><a class="art-link" href="hk-in-a-row/" aria-label="Играть в Храни короля"><img src="hk-in-a-row/poster.png" alt="Храни короля"></a><div class="card-body"><div class="title"><h2>Храни короля</h2><span data-version="hk-in-a-row">v__HK_IN_A_ROW_VERSION__</span></div><a class="play" href="hk-in-a-row/">Играть <span aria-hidden="true">↗</span></a></div></article>
</main>
<script>
fetch('versions.json', {cache:'no-store'}).then(response => {
  if (!response.ok) throw new Error('Cannot check current releases');
  return response.json();
}).then(catalog => {
  for (const slug of ['lovec-suiko','hk-in-a-row']) {
    const release = catalog.games[slug];
    if (!/^[a-f0-9]{40}$/.test(release.commit) || !/^[0-9]+\.[0-9]+\.[0-9]+$/.test(release.version)) throw new Error('Invalid release');
    for (const link of document.querySelectorAll('a[href^="'+slug+'/"]')) link.href = slug+'/?v='+release.commit+'&ui=__ASSET_VERSION__';
    document.querySelector('[data-version="'+slug+'"]').textContent = 'v'+release.version;
  }
}).catch(error => { console.warn(error); });
</script>
</body>
</html>
