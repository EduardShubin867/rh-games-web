name: Build and publish both Web games
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_cycle:
        description: 'Проверить сборку без публикации портала'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: write
      pages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tools/tests -v
      - name: Read and validate pinned releases
        id: refs
        run: python tools/build_site.py --refs >> "$GITHUB_OUTPUT"
      - name: Checkout Lovec Suiko source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: EduardShubin867/lovec-suiko
          ref: ${{ steps.refs.outputs.lovec_suiko }}
          ssh-key: ${{ secrets.LOVEC_SOURCE_KEY }}
          persist-credentials: false
          path: sources/lovec-suiko
      - name: Checkout Khrani Korolya source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: EduardShubin867/hk-in-a-row
          ref: ${{ steps.refs.outputs.hk_in_a_row }}
          ssh-key: ${{ secrets.HK_SOURCE_KEY }}
          persist-credentials: false
          path: sources/hk-in-a-row
      - name: Install verified Godot through authenticated GitHub requests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rh-godot"
          gh api repos/godotengine/godot/releases/tags/4.7.2-stable > "$RUNNER_TEMP/rh-godot/release.json"
          gh release download 4.7.2-stable --repo godotengine/godot \
            --pattern Godot_v4.7.2-stable_linux.x86_64.zip \
            --pattern Godot_v4.7.2-stable_export_templates.tpz \
            --dir "$RUNNER_TEMP/rh-godot"
          python - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "rh-godot"
          assets = {item["name"]: item for item in json.loads((root / "release.json").read_text())["assets"]}
          engine_name = "Godot_v4.7.2-stable_linux.x86_64"
          for name in (engine_name + ".zip", "Godot_v4.7.2-stable_export_templates.tpz"):
              if assets[name].get("digest") != "sha256:" + hashlib.sha256((root / name).read_bytes()).hexdigest():
                  raise SystemExit("Official Godot checksum mismatch: " + name)
          engine = root / engine_name
          with zipfile.ZipFile(root / (engine_name + ".zip")) as archive:
              engine.write_bytes(archive.read(engine_name))
          engine.chmod(0o755)
          templates = Path.home() / ".local/share/godot/export_templates/4.7.2.stable"
          templates.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(root / "Godot_v4.7.2-stable_export_templates.tpz") as archive:
              for name in ("web_nothreads_debug.zip", "web_nothreads_release.zip"):
                  (templates / name).write_bytes(archive.read("templates/" + name))
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("GODOT_BIN=" + str(engine) + "\n")
          print("Verified Godot 4.7.2 and Web templates installed")
          PY
      - name: Build and verify complete static site
        run: python tools/build_site.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist
      - name: Publish ready-to-host deploy branch
        if: ${{ github.ref == 'refs/heads/main' && !inputs.verify_cycle }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rh_latest_main=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          if [ "$rh_latest_main" != "$GITHUB_SHA" ]; then
            echo 'A newer main commit will publish the deploy branch.'
            exit 0
          fi

          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/rh-games-deploy.gitconfig"
          gh auth setup-git --hostname github.com
          rh_deploy_remote="https://github.com/${GITHUB_REPOSITORY}.git"
          rh_previous_sha=$(git ls-remote --heads "$rh_deploy_remote" refs/heads/deploy | cut -f1)
          if [ -n "$rh_previous_sha" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/contents/.rh-games-deploy.json?ref=${rh_previous_sha}" --jq .content \
              | base64 --decode > "$RUNNER_TEMP/rh-games-previous-deploy.json"
            rh_previous_source=$(python - "$RUNNER_TEMP/rh-games-previous-deploy.json" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1]))
          if data.get("publisher") != "rh-games-web" or not re.fullmatch(r"[0-9a-f]{40}", data.get("source_commit", "")):
              raise SystemExit("Refusing to overwrite a branch not owned by this publisher")
          print(data["source_commit"])
          PY
            )
            if [ "$rh_previous_source" = "$GITHUB_SHA" ]; then
              echo 'This exact site commit is already published in deploy.'
              exit 0
            fi
          fi

          export RH_DEPLOY_DIR
          RH_DEPLOY_DIR=$(mktemp -d "$RUNNER_TEMP/rh-games-deploy.XXXXXX")
          cp -a dist/. "$RH_DEPLOY_DIR/"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RH_DEPLOY_DIR"])
          catalog = json.loads((root / "versions.json").read_text())
          metadata = {"publisher": "rh-games-web", "source_commit": os.environ["GITHUB_SHA"], "games": catalog["games"]}
          (root / ".rh-games-deploy.json").write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + "\n")
          PY
          git -C "$RH_DEPLOY_DIR" init --initial-branch=deploy
          git -C "$RH_DEPLOY_DIR" config user.name 'github-actions[bot]'
          git -C "$RH_DEPLOY_DIR" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$RH_DEPLOY_DIR" add --all
          git -C "$RH_DEPLOY_DIR" commit -m "Publish RH Games from ${GITHUB_SHA}"
          git -C "$RH_DEPLOY_DIR" push \
            --force-with-lease="refs/heads/deploy:${rh_previous_sha}" \
            "$rh_deploy_remote" HEAD:refs/heads/deploy
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && !inputs.verify_cycle }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
